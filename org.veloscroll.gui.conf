<?xml version="1.0" encoding="UTF-8"?> <!-- -*- XML -*- -->

<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- This system bus denies name ownership and method calls by default (see the hardened
       /usr/share/dbus-1/system.conf); this drop-in punches the two holes the helper needs,
       following the same shape as org.freedesktop.PolicyKit1.conf. Per-operation security is
       enforced by polkit inside the service, not here — any local user may call it, exactly
       like they may call polkit itself. -->
  <policy user="root">
    <allow own="org.veloscroll.gui"/>
  </policy>

  <policy context="default">
    <allow send_destination="org.veloscroll.gui"/>
  </policy>
</busconfig>
